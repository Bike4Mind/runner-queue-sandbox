name: CI

# Mirrors two Bike4Mind/bike4mind CI jobs (core-build, test-shards) for runner timing.

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  core-build:
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event_name == 'merge_group' && 'b4m-merge-queue' || 'ubuntu-latest' }}
    name: Core Build
    timeout-minutes: 15
    permissions:
      contents: read

    outputs:
      core-content-hash: ${{ steps.core-hash.outputs.content_hash }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Bike4Mind/bike4mind
          ref: 7331c29baf16775b0652de3ca8d0c6fa81427675
          submodules: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Calculate core packages content hash
        id: core-hash
        run: |
          TREE_HASH_B4M=$(git ls-tree -r HEAD b4m-core packages/database packages/design-tokens packages/sdk | awk '{print $3}' | sort | md5sum | awk '{print $1}')
          CONFIG_HASH=$(git ls-tree HEAD package.json pnpm-lock.yaml pnpm-workspace.yaml tsconfig.json 2>/dev/null | awk '{print $3}' | sort | md5sum | awk '{print $1}')
          CONTENT_HASH=$(echo "${TREE_HASH_B4M}${CONFIG_HASH}" | md5sum | awk '{print $1}')
          echo "content_hash=$CONTENT_HASH" >> $GITHUB_OUTPUT
          echo "Core packages content hash: $CONTENT_HASH"

      - name: Show hardware
        run: |
          echo "runner=$RUNNER_NAME"
          nproc
          free -g | sed -n 2p
          grep -m1 "model name" /proc/cpuinfo

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Build bike4mind core packages
        run: pnpm core:build

      - name: Upload core build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: core-build-${{ steps.core-hash.outputs.content_hash }}
          path: |
            b4m-core/*/dist
            packages/database/dist
            packages/design-tokens/dist
            packages/sdk/dist
          retention-days: 1
          if-no-files-found: error

  test-shards:
    needs: core-build
    if: github.event_name != 'pull_request'
    runs-on: ${{ github.event_name == 'merge_group' && 'b4m-merge-queue' || 'ubuntu-latest' }}
    name: Run Tests (${{ matrix.shard.name }})
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      SHARD_SOFT_BUDGET_SECONDS: '600'

    strategy:
      fail-fast: false
      matrix:
        shard:
          - name: client 1/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=1/3'
            mongod: 'skip'
            sst: 'skip'
          - name: client 2/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=2/3'
            mongod: 'skip'
            sst: 'skip'
          - name: client 3/3
            tier: medium
            filter: '--filter @bike4mind/client'
            workers: ''
            args: '--shard=3/3'
            mongod: 'skip'
            sst: 'skip'
          - name: services-workers-integration
            tier: medium
            filter: '--filter @bike4mind/services'
            workers: ''
            integration-filter: '--filter @bike4mind/workers --filter @bike4mind/server-utils'
          - name: cli-desktop-workers
            tier: medium
            filter: '--filter @bike4mind/cli --filter @bike4mind/slack --filter @bike4mind/voice --filter @bike4mind/desktop --filter @bike4mind/workers'
            workers: ''
            typecheck: 'true'
          - name: data-client-integration
            tier: medium
            filter: '--filter @bike4mind/common --filter @bike4mind/database --filter @bike4mind/db-core --filter @bike4mind/core'
            workers: ''
            tmpfs: 'true'
            integration-filter: '--filter @bike4mind/client'
          - name: misc
            tier: medium
            filter: '--filter !@bike4mind/client --filter !@bike4mind/services --filter !@bike4mind/cli --filter !@bike4mind/slack --filter !@bike4mind/voice --filter !@bike4mind/desktop --filter !@bike4mind/workers --filter !@bike4mind/common --filter !@bike4mind/database --filter !@bike4mind/db-core --filter !@bike4mind/core'
            workers: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: Bike4Mind/bike4mind
          ref: 7331c29baf16775b0652de3ca8d0c6fa81427675
          submodules: false
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Show hardware
        run: |
          echo "runner=$RUNNER_NAME"
          nproc
          free -g | sed -n 2p
          grep -m1 "model name" /proc/cpuinfo

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Cache pnpm dependencies
        uses: actions/cache@v5
        with:
          path: |
            ~/.pnpm-store
            node_modules
            */*/node_modules
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --recursive

      - name: Download core build artifacts
        id: download-core
        uses: actions/download-artifact@v7
        with:
          name: core-build-${{ needs.core-build.outputs.core-content-hash }}
          path: .
        continue-on-error: true

      - name: Build bike4mind core packages (fallback)
        if: steps.download-core.outcome == 'failure'
        run: pnpm core:build

      - name: Download ripgrep binary (for grep_search tests)
        run: |
          POSTINSTALL_PATH=$(find node_modules/.pnpm -name "postinstall.js" -path "*/@vscode/ripgrep/lib/postinstall.js" -type f | head -1)
          if [ -n "$POSTINSTALL_PATH" ]; then
            node "$POSTINSTALL_PATH"
          fi
        continue-on-error: true

      - name: Run premium glue codegen
        id: codegen
        run: pnpm --filter @bike4mind/client run codegen

      - name: Generate SST types
        id: sst-types
        if: matrix.shard.sst != 'skip'
        run: bash scripts/ci-sst-install.sh
        env:
          CI: 'true'

      - name: Cache mongodb-memory-server binary
        if: matrix.shard.mongod != 'skip'
        uses: actions/cache@v5
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-binaries-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-mongodb-binaries-

      - name: Pre-warm mongodb-memory-server binary
        if: matrix.shard.mongod != 'skip'
        continue-on-error: true
        run: >-
          pnpm --filter @bike4mind/database exec node -e
          "require('mongodb-memory-server').MongoBinary.getPath({}).then(p => console.log('mongod binary ready:', p)).catch(e => console.warn('prewarm skipped:', e.message))"

      - name: Restore turbo test cache
        uses: actions/cache/restore@v5
        with:
          path: .turbo/cache
          key: turbo-test-v1-${{ runner.os }}-${{ matrix.shard.name }}-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-test-v1-${{ runner.os }}-${{ matrix.shard.name }}-

      - name: Mark shard start
        run: echo "SHARD_START_SECONDS=$(date +%s)" >> "$GITHUB_ENV"

      - name: Run Tests (${{ matrix.shard.name }})
        env:
          CI: true
          TURBO_TELEMETRY_DISABLED: '1'
          VITEST_MAX_WORKERS: ${{ matrix.shard.workers }}
          TMPDIR: ${{ matrix.shard.tmpfs == 'true' && '/dev/shm' || '' }}
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_FILTER: ${{ matrix.shard.filter }}
          SHARD_SCRIPT: 'test'
          SHARD_ARGS: ${{ matrix.shard.args }}
        run: |
          read -ra filter_args <<< "$SHARD_FILTER"
          read -ra script_args <<< "$SHARD_ARGS"

          matched=$(pnpm --recursive "${filter_args[@]}" ls --depth -1 --parseable | grep -cvxF "$PWD" || true)
          echo "${SHARD_NAME} matches ${matched} package(s)"
          if [ "$matched" -eq 0 ]; then
            echo "::error title=Empty test shard::The ${SHARD_NAME} leg's filters match no workspace package, so it would run no tests. Check the --filter tokens in the matrix."
            exit 1
          fi

          node scripts/turbo-test-cache.mjs context "$SHARD_SCRIPT" "${filter_args[@]}"
          status=0
          pnpm exec turbo run "$SHARD_SCRIPT" "${filter_args[@]}" --only --concurrency=1 --continue=always --env-mode=loose --ui=stream --cache-dir=.turbo/cache --summarize --output-logs=new-only -- "${script_args[@]}" || status=$?
          node scripts/turbo-test-cache.mjs report .turbo/runs
          exit "$status"

      - name: Run integration lane (${{ matrix.shard.name }})
        if: ${{ !cancelled() && matrix.shard.integration-filter && steps.codegen.outcome == 'success' }}
        env:
          CI: true
          TURBO_TELEMETRY_DISABLED: '1'
          VITEST_MAX_WORKERS: '2'
          TMPDIR: /dev/shm
          SHARD_NAME: ${{ matrix.shard.name }}
          SHARD_FILTER: ${{ matrix.shard.integration-filter }}
          SHARD_SCRIPT: 'test:integration'
        run: |
          read -ra filter_args <<< "$SHARD_FILTER"
          matched=$(pnpm --recursive "${filter_args[@]}" ls --depth -1 --parseable | grep -cvxF "$PWD" || true)
          echo "${SHARD_NAME} integration lane matches ${matched} package(s)"
          if [ "$matched" -eq 0 ]; then
            echo "::error title=Empty test shard::The ${SHARD_NAME} leg's integration-filter matches no workspace package, so it would run no tests. Check the --filter tokens in the matrix."
            exit 1
          fi
          node scripts/turbo-test-cache.mjs context "$SHARD_SCRIPT" "${filter_args[@]}"
          status=0
          pnpm exec turbo run "$SHARD_SCRIPT" "${filter_args[@]}" --only --concurrency=1 --continue=always --env-mode=loose --ui=stream --cache-dir=.turbo/cache --summarize --output-logs=new-only || status=$?
          node scripts/turbo-test-cache.mjs report .turbo/runs
          exit "$status"

      - name: Verify telemetry retention and worker scheduling across DST
        if: matrix.shard.name == 'services-workers-integration'
        env:
          TZ: America/New_York
          VITEST_MAX_WORKERS: '2'
          TMPDIR: /dev/shm
        run: |
          pnpm --filter @bike4mind/workers test:integration src/cron/telemetryCleanup.retention.e2e.test.ts
          pnpm --filter @bike4mind/workers test src/selfhost/selfHostWorker.dst.test.ts

      - name: Run root-level tests (outside pnpm workspaces)
        if: matrix.shard.name == 'misc'
        run: |
          pnpm exec vitest run --dir infra
          pnpm exec vitest run --dir scripts/codemods
          pnpm test:scripts
        env:
          CI: true
          VITEST_MAX_WORKERS: ${{ matrix.shard.workers }}

      - name: Run repo-scan tests
        if: ${{ !cancelled() && matrix.shard.name == 'misc' && steps.codegen.outcome == 'success' }}
        run: pnpm --recursive --if-present run test:repo
        env:
          CI: true
          VITEST_MAX_WORKERS: ${{ matrix.shard.workers }}

      - name: Report shard duration
        if: always() && env.SHARD_START_SECONDS != ''
        env:
          SHARD_NAME: ${{ matrix.shard.name }}
        run: |
          elapsed=$(( $(date +%s) - SHARD_START_SECONDS ))
          summary=$(printf '%s: %dm%02ds' "$SHARD_NAME" "$(( elapsed / 60 ))" "$(( elapsed % 60 ))")
          echo "- Run Tests (${summary})" >> "$GITHUB_STEP_SUMMARY"
          if [ "$elapsed" -gt "$SHARD_SOFT_BUDGET_SECONDS" ]; then
            echo "::warning title=Slow test shard::${summary} - over its ${SHARD_SOFT_BUDGET_SECONDS}s soft budget. Not a failure: split or speed up the shard before it reaches the job timeout."
          fi

      - name: Prune turbo test cache
        id: prune-turbo-cache
        if: ${{ !cancelled() && github.event_name == 'push' && hashFiles('.turbo/runs/*.json') != '' }}
        run: node scripts/turbo-test-cache.mjs prune .turbo/runs .turbo/cache

      - name: Save turbo test cache
        if: ${{ !cancelled() && steps.prune-turbo-cache.outcome == 'success' }}
        uses: actions/cache/save@v5
        with:
          path: .turbo/cache
          key: turbo-test-v1-${{ runner.os }}-${{ matrix.shard.name }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Type check (tsgo, tsc fallback)
        if: ${{ !cancelled() && matrix.shard.typecheck == 'true' && steps.sst-types.outcome == 'success' }}
        run: pnpm -w typecheck:fast && pnpm --recursive typecheck:fast

      - name: Type check infra (SST)
        if: ${{ !cancelled() && matrix.shard.typecheck == 'true' && steps.sst-types.outcome == 'success' }}
        run: pnpm typecheck:infra

  build:
    needs: [core-build, test-shards]
    if: always()
    runs-on: ${{ github.event_name == 'merge_group' && 'b4m-merge-queue' || 'ubuntu-latest' }}
    steps:
      - name: Report results
        run: |
          echo "core-build=${{ needs.core-build.result }}"
          echo "test-shards=${{ needs.test-shards.result }}"
          echo "runner=$RUNNER_NAME"
