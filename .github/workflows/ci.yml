name: CI

on:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ github.event_name == 'merge_group' && 'b4m-merge-queue' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Show runner
        run: |
          echo "event=$GITHUB_EVENT_NAME ref=$GITHUB_REF"
          echo "runner=$RUNNER_NAME os=$RUNNER_OS arch=$RUNNER_ARCH"
          nproc
          free -g | sed -n 2p
          node --version
          docker --version
