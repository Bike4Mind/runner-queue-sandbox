name: Admission

# Jobs here ask for the queue runner label from events it does not serve.
# Each one is expected to fail before any step runs.
on:
  pull_request:
  push:
    branches: [admission-test]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plain:
    runs-on: b4m-merge-queue
    timeout-minutes: 10
    steps:
      - run: echo "this step should not run"

  container:
    runs-on: b4m-merge-queue
    timeout-minutes: 10
    container: alpine:3.20
    steps:
      - run: echo "this step should not run"

  docker-action:
    runs-on: b4m-merge-queue
    timeout-minutes: 10
    steps:
      - uses: docker://alpine:3.20
        with:
          args: echo "this step should not run"
